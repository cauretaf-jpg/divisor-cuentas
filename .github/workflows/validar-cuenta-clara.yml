name: Validar Cuenta Clara

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'feature/asistente-contextual-propinas-2026-10'

jobs:
  validacion-estatica:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis de scripts
        run: |
          node --check script.js
          node --check profile.js
          node --check shared-utils.js
          node --check service-worker.js
      - name: Comprobar asistente y propinas
        run: node tests/validar-asistente.js

  interfaz-chromium:
    if: github.event_name == 'pull_request'
    needs: validacion-estatica
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright y navegador
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probar Inicio e Historial en navegador real
        run: node tests/smoke-ui.cjs
      - name: Guardar capturas para revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuenta-clara-ui-preview
          path: artifacts/ui/*.png
          if-no-files-found: ignore
          retention-days: 7
